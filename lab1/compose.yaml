name: gameshelf-lab1

x-backend: &backend
  image: gameshelf-lab1-backend
  build: ./backend
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "java -cp '/app/app.jar:/app/lib/*' com.gameshelf.lab1.Probe http://127.0.0.1:$$PORT/api/games"]
    interval: 5s
    timeout: 4s
    retries: 12
    start_period: 10s

x-tools: &tools
  image: gameshelf-lab1-tools
  build:
    context: .
    dockerfile: tools/Dockerfile

services:
  setup:
    <<: *tools
    entrypoint: ["sh", "/tools/setup.sh"]
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-lab1_password}
    volumes:
      - tls:/tls
      - auth:/auth

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: games
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_local
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-app.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d games"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend1:
    <<: *backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/games
      DB_USER: gamer
      DB_PASSWORD: gamer_local
      HOST: 0.0.0.0
      PORT: "8081"
      INSTANCE_ID: backend-1
    expose: ["8081"]

  backend2:
    <<: *backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/games
      DB_USER: gamer
      DB_PASSWORD: gamer_local
      HOST: 0.0.0.0
      PORT: "8082"
      INSTANCE_ID: backend-2
    expose: ["8082"]

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./web/games:/srv/games:ro
      - ./web/status:/srv/status:ro
      - ./docs/public:/srv/docs:ro
      - tls:/etc/nginx/tls:ro
      - auth:/etc/nginx/auth:ro
    depends_on:
      setup:
        condition: service_completed_successfully
      backend1:
        condition: service_healthy
      backend2:
        condition: service_healthy
    restart: unless-stopped

  checker:
    <<: *tools
    profiles: ["tools"]
    entrypoint: ["sh", "/tools/check.sh"]
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-lab1_password}
    volumes:
      - tls:/tls:ro
      - ./docs/checks:/reports
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  pgdata:
  tls:
  auth:
