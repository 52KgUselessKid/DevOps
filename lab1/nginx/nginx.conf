user nginx;
# Для небольшой лабы одного worker достаточно, чередование тоже легче увидеть.
worker_processes 1;
error_log /dev/stderr info;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    client_max_body_size 16k;

    log_format lab '$time_iso8601 host=$host "$request" status=$status '
                   'upstream=$upstream_addr backend=$upstream_http_x_backend_id '
                   'limit=$limit_req_status';
    access_log /dev/stdout lab;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 10m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_status 429;

    # Адреса определяются при старте/reload. Остановка процесса не меняет upstream.
    upstream games {
        zone games 64k;
        server backend1:8081 max_fails=1 fail_timeout=5s;
        server backend2:8082 max_fails=1 fail_timeout=5s;
        keepalive 16;
    }

    # Неизвестное имя не получает ни один из проектов.
    server {
        listen 80 default_server;
        server_name _;
        default_type text/plain;
        return 404 "Unknown virtual host\n";
    }
    server {
        listen 443 ssl default_server;
        server_name _;
        ssl_reject_handshake on;
        return 404;
    }

    server {
        listen 80;
        server_name localhost status.localhost;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name localhost;
        ssl_certificate /etc/nginx/tls/local.crt;
        ssl_certificate_key /etc/nginx/tls/local.key;
        root /srv/games;
        index index.html;
        add_header X-Project game-shelf always;
        add_header X-Proxy nginx always;

        error_page 404 /errors/404.html;
        error_page 500 502 503 504 /errors/50x.html;
        location = /errors/404.html { internal; }
        location = /errors/50x.html { internal; }

        # Java получает только API, сама страница читается nginx с диска.
        location = /api { include /etc/nginx/snippets/api.conf; }
        location ^~ /api/ { include /etc/nginx/snippets/api.conf; }

        location = /docs { return 301 /docs/; }
        location ^~ /docs/ {
            alias /srv/docs/;
            index index.html;
        }

        location = /admin {
            auth_basic "Game Shelf admin";
            auth_basic_user_file /etc/nginx/auth/admin.htpasswd;
            try_files /admin/index.html =404;
        }
        location ^~ /admin/ {
            auth_basic "Game Shelf admin";
            auth_basic_user_file /etc/nginx/auth/admin.htpasswd;
            try_files $uri $uri/ =404;
        }
        location / { try_files $uri $uri/ =404; }
    }

    # У второго домена свой root. API и админки соседнего сайта здесь нет.
    server {
        listen 443 ssl;
        server_name status.localhost;
        ssl_certificate /etc/nginx/tls/local.crt;
        ssl_certificate_key /etc/nginx/tls/local.key;
        root /srv/status;
        index index.html;
        add_header X-Project status-site always;
        error_page 404 /404.html;
        location = /404.html { internal; }
        location / { try_files $uri $uri/ =404; }
    }
}
